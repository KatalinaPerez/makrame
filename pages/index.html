<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Macramé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles/main.css" rel="stylesheet">
</head>
<body>
<header id="header"></header>

<main class="container mt-4">
  <h1 class="text-center">Bienvenidos a Micro Macramé</h1>
  <div id="filters" class="text-center my-3">
    <select id="categoryFilter" class="form-select d-inline-block w-auto">
      <option value="">Todas las categorías</option>
      <option value="aros">Aros</option>
      <option value="llaveros">Llaveros</option>
      <option value="collares">Collares</option>
    </select>
    <select id="priceFilter" class="form-select d-inline-block w-auto">
      <option value="">Ordenar por precio</option>
      <option value="asc">De menor a mayor</option>
      <option value="desc">De mayor a menor</option>
    </select>
  </div>

  <div id="products" class="row">
    <!-- Aquí se cargarán los productos -->
  </div>
</main>

<section id="contacto" class="container mt-5">
  <h2 class="text-center">Contacto</h2>
  <form class="mt-3">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Correo Electrónico</label>
      <input type="email" class="form-control" id="email" placeholder="Tu correo">
    </div>
    <div class="mb-3">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" rows="3" placeholder="Escribe tu mensaje"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>
</section>

<footer id="footer"></footer>

<script src="js/header-footer.js"></script>
<script src="js/products.js"></script>
</body>
</html>
